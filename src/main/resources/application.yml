spring:
  application:
    name: mopl
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: [ openid, email, profile ]
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope: [ profile_nickname, profile_image ]
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  data:
    redis:
      timeout: 500ms
  task:
    scheduling:
      pool:
        size: 5

mopl:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 1800000
    refresh-token-expiry-ms: 604800000
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/w500

admin:
  name: admin
  email: ${ADMIN_EMAIL:system@mopl.io}
  password: ${ADMIN_PASSWORD:admin1!}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  health:
    mail:
      enabled: false
server:
  forward-headers-strategy: native
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

opensearch:
  uri: ${OPENSEARCH_URI:https://localhost:9200}
  username: ${OPENSEARCH_USERNAME:}
  password: ${OPENSEARCH_PASSWORD:}
